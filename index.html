<!doctype html>
<!--
  Главная страница приложения «Корзинка».
  Это «скелет»: шапка, место для экранов и нижнее меню с вкладками.
  Содержимое экранов рисует файл js/app.js.
-->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Корзинка</title>
  <meta name="description" content="Планировщик меню на неделю с учётом акций Lidl">

  <!-- Цвет верхней полоски браузера на телефоне -->
  <meta name="theme-color" content="#2f8f5b">

  <!-- «Паспорт» приложения: имя, иконки, цвета — нужен для установки на телефон -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__logo" aria-hidden="true">
      <img src="icons/icon.svg" alt="" width="32" height="32">
    </div>
    <div>
      <h1 class="topbar__title" id="screen-title">Корзинка</h1>
      <p class="topbar__subtitle">Меню на неделю с акциями Lidl</p>
    </div>
  </header>

  <!-- Сюда app.js подставляет содержимое выбранной вкладки -->
  <main id="screen" class="screen" tabindex="-1"></main>

  <!-- Нижнее меню с вкладками -->
  <nav class="tabbar" aria-label="Разделы">
    <a class="tabbar__item" href="#menu" data-route="menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
      <span>Меню</span>
    </a>
    <a class="tabbar__item" href="#shopping" data-route="shopping">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h18l-2 11H5L3 9z"/><path d="M8 9l4-6 4 6"/></svg>
      <span>Покупки</span>
    </a>
    <a class="tabbar__item" href="#recipes" data-route="recipes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>
      <span>Рецепты</span>
    </a>
    <a class="tabbar__item" href="#settings" data-route="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
      <span>Анкета</span>
    </a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
